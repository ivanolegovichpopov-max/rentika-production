server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг: любой путь, не найденный как файл, отдаём index.html —
    # React Router сам разберётся с /login, /register и т.п. на клиенте.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статические ассеты со сборочными хэшами в имени можно кэшировать долго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
